# agent
# Using the state agent logic, but renamed for clarity
agent_name: warp_state_agent

# env setting
env:
  # Identifier for environment type (used potentially in agent/worker logic)
  env: WARPHand
  # Specific task name, used for logging/saving potentially
  game: AllegroRotateCube
  base_seed: 0
  # n_skip: 1 # Assuming frame skip is handled inside WARP env or wrapper if needed
  n_stack: 1 # No frame stacking for state-based observations
  max_episode_steps: 300 # From handenv.py main() example
  gray_scale: False # Not image based
  image_based: False # State based
  clip_reward: False # Start without clipping, adjust if necessary
  obs_shape: 55
  episodic: True # Episodes have a max length
  render_mode: none # none for none, anything else for full

rl:
  discount: 0.997 # Keep DMC default
  unroll_steps: 5   # Keep DMC default
  td_steps: 5 # Keep DMC default
  # Adjust based on max_episode_steps and convergence speed if needed
  auto_td_steps: 20000 # Scaled down slightly for shorter episodes? Needs tuning.
  td_lambda: 0.95 # Keep DMC default

# optimizer
optimizer:
  type: Adam
  lr: 3e-4 # Keep DMC default
  lr_warm_up: 0.01
  lr_decay_type: none
  lr_decay_rate: 0.1
  lr_decay_steps: 300000
  weight_decay: 2e-5
  momentum: 0.9

# priority of data
priority:
  use_priority: True
  priority_prob_alpha: 1.0 # Keep DMC default
  priority_prob_beta: 1.0 # Keep DMC default
  min_prior: 0.000001

# training
train:
  load_model_path: ''
  batch_size: 256
  training_steps: 100000
  offline_training_steps: 20000
  # Start training after fewer initial random steps
  start_transitions: 2000

  eval_n_episode: 10
  # Evaluate more frequently initially
  eval_interval: 5000

  self_play_update_interval: 100
  reanalyze_update_interval: 200
  save_ckpt_interval: 10000

  mini_batch_size: 256
  reanalyze_ratio: 1.0

  reward_loss_coeff: 1.0
  value_loss_coeff: 0.5 # Keep DMC default
  policy_loss_coeff: 1.0
  consistency_coeff: 2.0 # Important for model learning
  decorrelation_coeff: 0.01
  off_diag_coeff: 5e-3
  entropy_coeff: 5e-2 # Keep DMC default

  max_grad_norm: 5
  change_temperature: True

  periodic_reset: False
  value_reanalyze: False
  path_consistency: False
  use_decorrelation: False
  value_policy_detach: False
  optimal_Q: False
  v_num: 1
  value_target: 'mixed'   # Keep mixed target approach
  use_IQL: False
  IQL_weight: 0.5
  # Adjust timings based on total training steps if needed
  start_use_mix_training_steps: 4e4
  mixed_value_threshold: 2e4

# self-play data collection
data:
  # WARP often benefits from parallel envs, but start with 1 based on handenv.py
  num_envs: 4
  # Adjust buffer based on memory, reduce initially
  buffer_size: 100000
  total_transitions: 100000 # Match buffer size for initial online run
  top_transitions: 2e5
  trajectory_size: 300 # Match max_episode_steps
  save_video: False # Enable if needed for debugging
  save_as_dataset: False

# MCTS
mcts:
  language: cython # Keep default unless issues arise
  num_simulations: 32 # Keep DMC default
  num_top_actions: 16 # Keep DMC default
  num_sampled_actions: 16 # Keep DMC default
  c_visit: 50
  c_scale: 0.1
  value_minmax_delta: 0.01
  mpc_horizon: 1
  vis: ['print']
  use_mppi: False
  std_magnification: 3

# model architecture
model:
  noisy_net: False
  action_embedding: True # Good for continuous action spaces
  block_type: resnet
  down_sample: True
  state_norm: False # Potentially helpful for state inputs
  value_prefix: False
  value_target: bootstrapped
  GAE_max_steps: 15
  dynamic_type: None
  init_zero: True
  use_bn: True
  use_p_norm: False
  num_blocks: 2

  # Using smaller shapes from dmc_state.txt as a starting point
  hidden_shape: 128
  rep_net_shape: 256
  dyn_shape: 256
  act_embed_shape: 64 # Needs to match action embedding output if used
  rew_net_shape: [ 256, 256 ]
  val_net_shape: [ 256, 256 ]
  pi_net_shape: [ 256, 256 ]
  proj_hid_shape: 512
  pred_hid_shape: 512
  proj_shape: 128
  pred_shape: 128

  fc_layers: [32]
  lstm_hidden_size: 512
  lstm_horizon_len: 5
  value_ensumble: 1

  # --- CRITICAL: Ensure this matches handenv action space ---
  policy_distribution: squashed_gaussian # Standard for bounded continuous actions
  policy_loss_type: reanalyze
  policy_action_num: 4 # Likely needs adjustment based on sampling strategy
  random_action_num: 12 # Likely needs adjustment based on sampling strategy
  random_type: std

  # --- Needs Verification ---
  # TODO: Check if the actual reward range in handenv matches [-2, 2]
  reward_support:
    range: [ -2, 2 ] # <<< Placeholder - Adjust if needed!
    scale: 0.01
    env: WARPHand # Changed env name
    bins: 51
    type: support
  # TODO: Check if the expected value range matches [-299, 299]
  value_support:
    range: [ -299, 299 ] # <<< Placeholder - Adjust if needed!
    scale: 0.5
    env: WARPHand # Changed env name
    bins: 51
    type: support

# worker process allocation
actors:
  data_worker: 1
  batch_worker: 10

# wandb
wandb:
  project: 'ez-v2-handenv' # Changed project name
  tag: 'AllegroRotateCube' # Changed tag